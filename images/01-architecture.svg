<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <rect width="1100" height="420" fill="#fff7ed"/>
  <text x="550" y="45" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" font-weight="700" fill="#7c2d12">CPA + VSCode + OAI 插件整体链路</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.18"/></filter>
  </defs>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="45" y="135" width="190" height="110" rx="18" fill="#fed7aa" stroke="#fb923c" stroke-width="3"/>
    <text x="140" y="178" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">你</text>
    <text x="140" y="210" text-anchor="middle" font-size="16" fill="#7c2d12">在 VSCode 提问</text>

    <rect x="310" y="135" width="210" height="110" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
    <text x="415" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">VSCode</text>
    <text x="415" y="204" text-anchor="middle" font-size="16" fill="#1e3a8a">Copilot Chat</text>

    <rect x="595" y="135" width="220" height="110" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/>
    <text x="705" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#14532d">OAI 插件</text>
    <text x="705" y="198" text-anchor="middle" font-size="15" fill="#14532d">Base URL 指向 CPA</text>
    <text x="705" y="222" text-anchor="middle" font-size="14" fill="#14532d">http://localhost:8317/v1</text>

    <rect x="885" y="135" width="175" height="110" rx="18" fill="#f3e8ff" stroke="#a855f7" stroke-width="3"/>
    <text x="972" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#581c87">CPA</text>
    <text x="972" y="204" text-anchor="middle" font-size="16" fill="#581c87">CLIProxyAPI</text>
  </g>
  <line x1="235" y1="190" x2="305" y2="190" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="520" y1="190" x2="590" y2="190" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="815" y1="190" x2="880" y2="190" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M972 245 C972 330, 430 330, 180 245" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/>
  <text x="560" y="360" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#7c2d12">模型回答沿原路返回，最后显示在 VSCode Copilot Chat 里</text>
</svg>
